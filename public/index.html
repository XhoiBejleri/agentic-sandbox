<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Measurement Runs</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:24px;background:#f7f8fa;color:#17202a}
  h1{font-size:1.4rem;margin:0 0 16px}
  table{border-collapse:collapse;width:100%;max-width:760px;background:#fff}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #e3e6ea;font-size:.95rem}
  th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:#5b6672}
  form{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0;max-width:760px}
  input,select,button{padding:8px 10px;font:inherit;border:1px solid #c9ced6;border-radius:4px}
  button{background:#1e4fa3;color:#fff;border-color:#1e4fa3;cursor:pointer}
  .status{font-size:.85rem;color:#5b6672;min-height:1.2em}
</style>
</head>
<body>
  <h1>Measurement Runs</h1>
  <form id="new-run" aria-label="Add run">
    <input id="vehicleId" name="vehicleId" placeholder="Vehicle ID" required>
    <select id="cycle" name="cycle" aria-label="Cycle">
      <option value="WLTC">WLTC</option>
      <option value="NEDC">NEDC</option>
      <option value="RDE">RDE</option>
    </select>
    <input id="co2" name="co2GramsPerKm" type="number" step="0.1" placeholder="CO2 g/km" required>
    <button type="submit">Add run</button>
  </form>
  <p id="status" class="status" role="status"></p>
  <label for="vehicle-filter">Filter by vehicle</label>
  <input id="vehicle-filter" type="search" autocomplete="off">
  <table aria-label="Runs">
    <thead><tr><th>ID</th><th>Vehicle</th><th>Cycle</th><th>CO2 g/km</th><th>Status</th></tr></thead>
    <tbody id="runs"></tbody>
  </table>
<script>
  const tbody = document.getElementById("runs");
  const status = document.getElementById("status");
  const vehicleFilter = document.getElementById("vehicle-filter");
  let allRuns = [];
  function renderRuns() {
    const query = vehicleFilter.value.trim().toLowerCase();
    const visibleRuns = allRuns.filter(r => r.vehicleId.toLowerCase().includes(query));
    tbody.innerHTML = visibleRuns.map(r => `<tr data-run-id="${r.id}"><td>${r.id}</td><td>${r.vehicleId}</td><td>${r.cycle}</td><td>${r.co2GramsPerKm}</td><td>${r.status}</td></tr>`).join("");
  }
  async function load() {
    const res = await fetch("/api/runs");
    allRuns = await res.json();
    renderRuns();
  }
  vehicleFilter.addEventListener("input", renderRuns);
  document.getElementById("new-run").addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = {
      vehicleId: document.getElementById("vehicleId").value,
      cycle: document.getElementById("cycle").value,
      co2GramsPerKm: Number(document.getElementById("co2").value)
    };
    const res = await fetch("/api/runs", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    status.textContent = res.ok ? `Created ${data.id}` : `Error: ${(data.details || [data.error]).join(", ")}`;
    if (res.ok) { e.target.reset(); load(); }
  });
  load();
</script>
</body>
</html>
